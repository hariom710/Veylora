[package]
name = "veylora"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
path = "src/lib.rs"

[dependencies]
argon2 = "0.5"
chacha20poly1305 = "0.11"
getrandom = "0.2"
hkdf = "0.12"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
zeroize = { version = "1.7", features = ["derive"] }
hybrid-array = "0.4"
typenum = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
subtle = "2"
tauri = { version = "2.10", features = [] }
tauri-plugin-dialog = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }
