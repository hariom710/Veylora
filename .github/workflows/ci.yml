name: CI

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  # Full packaged build: compiles the release profile, validates tauri.conf
  # (CSP schema) and produces the NSIS installer, exactly like a local
  # `pnpm tauri build`.
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build
      # Browser-level E2E: install the artifact just built and drive the
      # packaged WebView2 over CDP with scripts/smoke.ps1 (9 assertions,
      # exits non-zero on any failure).
      - name: Install packaged build
        run: |
          $setup = (Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1).FullName
          $p = Start-Process $setup -ArgumentList '/S' -Wait -PassThru
          exit $p.ExitCode
      - name: Packaged smoke (CDP E2E)
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/smoke.ps1

  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # generate_context! embeds ../dist at compile time and fails if the
      # path is missing; tests don't serve assets, so an empty dir is enough.
      - run: New-Item -ItemType Directory -Force dist
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml
