name: Release

on:
  push:
    tags: ['v*']

# Creates the release and uploads assets; newer repos default the
# GITHUB_TOKEN to read-only, which would fail both.
permissions:
  contents: write

jobs:
  build-and-sign:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # Same pinned toolchain as ci.yml: lockfileVersion 6.0 needs pnpm 8,
      # which corepack's unpinned default does not guarantee.
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Tauri build
        # Signs the updater artifacts (.sig) with the release minisign key;
        # without it the build fails now that createUpdaterArtifacts is on.
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build

      - name: Compute SHA-256 of installer
        id: hash
        run: |
          # Filter on the exact suffix: build now also emits *.exe.sig files.
          $installer = Get-ChildItem -Path src-tauri\target\release\bundle\nsis\* -File | Where-Object { $_.Name -like '*-setup.exe' } | Select-Object -First 1
          if (-not $installer) { $installer = Get-ChildItem -Path src-tauri\target\release\bundle\msi\*.msi -File | Select-Object -First 1 }
          $hash = Get-FileHash -Algorithm SHA256 $installer.FullName | Select-Object -ExpandProperty Hash
          # The bundler emits no sidecar; write one so the release ships a
          # hash file matching the attached asset.
          Set-Content -Path "$($installer.FullName).sha256" -Value "$hash  $($installer.Name)" -NoNewline -Encoding ascii
          echo "hash=$hash" >> $env:GITHUB_OUTPUT
          echo "installer=$($installer.Name)" >> $env:GITHUB_OUTPUT

      # Static manifest the tauri updater plugin polls
      # (releases/latest/download/latest.json): version, notes, and the
      # signed URL + signature of the Windows installer.
      - name: Build updater latest.json
        id: updater
        run: |
          $sig = Get-ChildItem src-tauri\target\release\bundle\nsis\*.exe.sig | Select-Object -First 1
          if (-not $sig) { throw "No updater .sig produced - createUpdaterArtifacts must be on" }
          $exe = Get-ChildItem src-tauri\target\release\bundle\nsis\*-setup.exe | Where-Object { $_.Name -notlike '*.sig' } | Select-Object -First 1
          $version = "${{ github.ref_name }}".TrimStart('v')
          $manifest = @{
            version = $version
            notes = "See https://github.com/hariom710/Veylora/releases/tag/${{ github.ref_name }}"
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{
              "windows-x86_64" = @{
                signature = (Get-Content $sig.FullName -Raw).Trim()
                url = "https://github.com/hariom710/Veylora/releases/download/${{ github.ref_name }}/$($exe.Name)"
              }
            }
          } | ConvertTo-Json -Depth 4
          # UTF-8 without BOM: serde_json rejects a BOM.
          [System.IO.File]::WriteAllText("$PWD\latest.json", $manifest, (New-Object System.Text.UTF8Encoding $false))
          echo "path=$PWD\latest.json" >> $env:GITHUB_OUTPUT
          Get-Content "$PWD\latest.json" -Raw

      - name: Sign installer (if certificate available)
        id: sign
        run: |
          if ($env:VEYLORA_SIGN_CERT -and $env:VEYLORA_SIGN_PASSWORD) {
            Write-Host "Signing installer with certificate..."
            $certPath = Join-Path $env:TEMP "veylora_sign.pfx"
            [System.IO.File]::WriteAllBytes($certPath, [System.Convert]::FromBase64String($env:VEYLORA_SIGN_CERT))
            signtool sign /f $certPath /p $env:VEYLORA_SIGN_PASSWORD /t http://timestamp.digicert.com src-tauri\target\release\bundle\nsis\${{ steps.hash.outputs.installer }}
            Write-Host "Installer signed successfully."
          } else {
            Write-Host "WARNING: No code signing certificate found. Installer is UNSIGNED."
            Write-Host "Users will see a SmartScreen warning. Verify SHA-256 before running."
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref }}
          name: Veylora ${{ github.ref_name }}
          body: |
            See RELEASE_NOTES.md for full release notes.
            Installer SHA-256: ${{ steps.hash.outputs.hash }}
            ${{ steps.sign.outputs.signed != 'true' && '**WARNING: Installer is UNSIGNED. Verify SHA-256 before running.**' || '' }}
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sha256
            src-tauri/target/release/bundle/nsis/*.sig
            latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
