name: Release

on:
  push:
    tags: ['v*']

jobs:
  build-and-sign:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Tauri build
        run: pnpm tauri build

      - name: Compute SHA-256 of installer
        id: hash
        run: |
          $installer = Get-ChildItem -Path src-tauri\target\release\bundle\msi\* -File | Select-Object -First 1
          if (-not $installer) { $installer = Get-ChildItem -Path src-tauri\target\release\bundle\nsis\* -File | Select-Object -First 1 }
          $hash = Get-FileHash -Algorithm SHA256 $installer.FullName | Select-Object -ExpandProperty Hash
          echo "hash=$hash" >> $env:GITHUB_OUTPUT
          echo "installer=$($installer.Name)" >> $env:GITHUB_OUTPUT

      - name: Sign installer (if certificate available)
        id: sign
        run: |
          if ($env:VEYLORA_SIGN_CERT -and $env:VEYLORA_SIGN_PASSWORD) {
            Write-Host "Signing installer with certificate..."
            $certPath = Join-Path $env:TEMP "veylora_sign.pfx"
            [System.IO.File]::WriteAllBytes($certPath, [System.Convert]::FromBase64String($env:VEYLORA_SIGN_CERT))
            signtool sign /f $certPath /p $env:VEYLORA_SIGN_PASSWORD /t http://timestamp.digicert.com src-tauri\target\release\bundle\nsis\${{ steps.hash.outputs.installer }}
            Write-Host "Installer signed successfully."
          } else {
            Write-Host "WARNING: No code signing certificate found. Installer is UNSIGNED."
            Write-Host "Users will see a SmartScreen warning. Verify SHA-256 before running."
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref }}
          name: Veylora ${{ github.ref }}
          body: |
            See RELEASE_NOTES.md for full release notes.
            Installer SHA-256: ${{ steps.hash.outputs.hash }}
            ${{ steps.sign.outputs.signed != 'true' && '**WARNING: Installer is UNSIGNED. Verify SHA-256 before running.**' || '' }}
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
